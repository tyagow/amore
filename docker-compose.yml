# Local Postgres and Redis are optional for development.
# By default, DATABASE_URL in .env.local points to Railway Postgres.
# Only start these if you need a fully offline dev environment.
services:
  postgres:
    image: postgres:17-alpine
    container_name: amore-couples-postgres
    environment:
      POSTGRES_USER: amore-couples
      POSTGRES_PASSWORD: amore_dev_password
      POSTGRES_DB: amore_couples
    ports:
      - "5440:5432"
    volumes:
      - amore_couples_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amore-couples"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amore-couples-redis
    ports:
      - "6381:6379"
    volumes:
      - amore_couples_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amore_couples_pgdata:
  amore_couples_redis:
